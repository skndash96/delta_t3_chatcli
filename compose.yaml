version: '3.8'

services:

  db:
    container_name: postgres_db
    build:
      context: postgres
      dockerfile: Dockerfile
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: